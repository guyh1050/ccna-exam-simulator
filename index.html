<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA Full Exam Simulator - 100 Questions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    :root {
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --secondary: #0f766e;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #166534;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Assistant', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 24px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 800;
    }

    header p {
      font-size: 14px;
      color: #bfdbfe;
      margin-top: 4px;
    }

    .timer-badge {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .content-area {
      padding: 30px;
    }

    .setup-section {
      margin-bottom: 25px;
    }

    .setup-section h3 {
      font-size: 17px;
      margin-bottom: 12px;
      color: var(--primary);
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 6px;
    }

    .grid-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .checkbox-label, .radio-label {
      display: flex;
      align-items: center;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .checkbox-label:hover, .radio-label:hover {
      background: var(--primary-light);
      border-color: #bfdbfe;
    }

    input[type="checkbox"], input[type="radio"] {
      margin-left: 10px;
      accent-color: var(--primary);
    }

    .btn-main {
      display: block;
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 25px;
    }

    .btn-main:hover {
      background: var(--primary-hover);
    }

    .exam-progress {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .question-card {
      margin-bottom: 25px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    .question-header {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #1e293b;
    }

    .question-category {
      display: inline-block;
      font-size: 11px;
      background: #f1f5f9;
      color: #475569;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: #fafafa;
      font-size: 14px;
      transition: all 0.15s;
    }

    .option-item:hover {
      background: #f1f5f9;
    }

    .option-item.selected {
      background: var(--primary-light);
      border-color: #3b82f6;
      font-weight: 600;
    }

    .option-item.is-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text);
      font-weight: 700;
    }

    .option-item.is-wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text);
    }

    .explanation-box {
      margin-top: 15px;
      padding: 15px;
      background: #f8fafc;
      border-right: 4px solid var(--primary);
      border-radius: 6px;
      font-size: 14px;
      display: none;
      line-height: 1.6;
    }

    .explanation-section {
      margin-bottom: 8px;
    }

    .explanation-section strong {
      color: var(--primary);
      display: block;
      margin-bottom: 2px;
    }

    .pt-diagram {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
      direction: ltr;
    }

    .pt-bar {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 8px;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 4px;
    }

    .results-card {
      text-align: center;
      padding: 30px;
      background: #f0fdf4;
      border: 2px solid #22c55e;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .results-card h2 {
      color: #15803d;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .score-circle {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
      margin: 15px 0;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>CCNA Full Exam Simulator</h1>
      <p>סימולטור מבחן מלא ברשתות עם תמיכה בעד 100 שאלות והסבר תלת-שלבי מובנה</p>
    </div>
    <div class="timer-badge" id="timer-display">--:--</div>
  </header>

  <div class="content-area">
    <!-- מסך הגדרות -->
    <div id="setup-view">
      <div class="setup-section">
        <h3>1. בחר כמות שאלות במבחן</h3>
        <div class="grid-options">
          <label class="radio-label"><input type="radio" name="q-count" value="10"> 10 שאלות</label>
          <label class="radio-label"><input type="radio" name="q-count" value="25"> 25 שאלות</label>
          <label class="radio-label"><input type="radio" name="q-count" value="50" checked> 50 שאלות</label>
          <label class="radio-label"><input type="radio" name="q-count" value="100"> 100 שאלות (מבחן הסמכה מלא)</label>
          <label class="radio-label"><input type="radio" name="q-count" value="all"> כל השאלות במאגר שנבחרו</label>
        </div>
      </div>

      <div class="setup-section">
        <h3>2. הגבלת זמן (טיימר)</h3>
        <div class="grid-options">
          <label class="radio-label"><input type="radio" name="time-limit" value="15"> 15 דקות</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="30"> 30 דקות</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="60"> 60 דקות</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="120" checked> 120 דקות (תואם מבחן CCNA)</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="0"> ללא הגבלת זמן</label>
        </div>
      </div>

      <div class="setup-section">
        <h3>3. בחר נושאים למבחן (כל נושאי ה-CCNA)</h3>
        <div style="margin-bottom: 10px;">
          <button type="button" onclick="selectAllCategories(true)" style="font-size: 12px; padding: 4px 8px; cursor: pointer;">בחר הכל</button>
          <button type="button" onclick="selectAllCategories(false)" style="font-size: 12px; padding: 4px 8px; cursor: pointer;">נקה הכל</button>
        </div>
        <div class="grid-options" id="category-selectors"></div>
      </div>

      <button class="btn-main" onclick="startExam()">התחל מבחן עכשיו</button>
    </div>

    <!-- מסך שאלות -->
    <div id="exam-view" style="display: none;">
      <div class="exam-progress">
        <span id="progress-counter">שאלה 0 מתוך 0</span>
        <span id="answered-counter">נענו: 0</span>
      </div>

      <div id="questions-container"></div>

      <button class="btn-main" id="submit-btn" onclick="finishExam()">הגש מבחן ובדוק תוצאות</button>
    </div>

    <!-- מסך תוצאות -->
    <div id="result-view" style="display: none;">
      <div class="results-card" id="results-card">
        <h2>סיום המבחן!</h2>
        <div class="score-circle" id="final-score">0%</div>
        <p id="results-summary"></p>
        <button class="btn-main" style="max-width: 200px; margin: 20px auto 0 auto;" onclick="restart()">מבחן חדש</button>
      </div>

      <h3 style="margin-bottom: 15px; color: var(--primary);">פירוט תשובות והסברים לפי 3 חלקים:</h3>
      <div id="review-container"></div>
    </div>
  </div>
</div>

<script>
// מאגר שאלות מורחב ומקיף לכל נושאי ה-CCNA
const questionBank = [
  // נושא 1: יסודות רשת ומודל OSI
  {
    cat: "יסודות רשת ומודל OSI",
    q: "מהו התפקיד המרכזי של שדה ה-FCS (Frame Check Sequence) בסיום מסגרת Ethernet?",
    options: ["להצפין את תוכן הפאקטה", "לזהות שגיאות ושיבושי ביטים באמצעות חישוב CRC", "לזהות את ה-VLAN של היעד", "לקבוע את כתובת ה-IP של השולח"],
    ans: 1,
    expSimple: "שדה ה-FCS מוודא שהמידע שנשלח בכבל לא השתבש או נפגע בדרך בגלל הפרעות חשמליות.",
    expAnalogy: "תחשוב על חותמת שעווה של מכתב רשמי: אם החותמת שבורה כשהמכתב מגיע ליעדך, אתה יודע שמישהו פגע בו בדרך ואתה זורק אותו לפח מיד.",
    expOneLine: "FCS הוא מנגנון בדיקת תקינות ברמת שכבה 2 שמוודא שהמסגרת לא שובשה במהלך השידור."
  },
  {
    cat: "יסודות רשת ומודל OSI",
    q: "באיזו שכבה במודל ה-OSI פועלים נתבים (Routers) בעת קבלת החלטת העברת תעבורה?",
    options: ["שכבה 1 (Physical)", "שכבה 2 (Data Link)", "שכבה 3 (Network)", "שכבה 4 (Transport)"],
    ans: 2,
    expSimple: "נתבים בוחנים כתובות IP לוגיות של היעד, וכתובות IP מוגדרות בשכבה 3 של המודל.",
    expAnalogy: "תחשוב על סניף דואר ארצי שממיין מכתבים לפי שם העיר והמיקוד (כתובת שכבה 3), ולא לפי מספר תעודת הזהות של האדם (כתובת MAC).",
    expOneLine: "נתבים פועלים בשכבה 3 (Network Layer) ומקבלים החלטות ניתוב על בסיס כתובות IP."
  },
  {
    cat: "יסודות רשת ומודל OSI",
    q: "מה מאפיין מצב תקשורת מסוג Half-Duplex ברשת מקומית?",
    options: ["שני הצדדים משדרים וקולטים בו-זמנית", "רק צד אחד יכול לשדר בכל רגע נתון, וקיימת סכנת התנגשות", "המידע מועבר ללא צורך בכבלים", "התעבורה מוגנת אוטומטית בהצפנה"],
    ans: 1,
    expSimple: "במצב Half-Duplex ערוץ התקשורת משותף, ולכן אם שני מכשירים ישדרו יחד תיווצר התנגשות שמחייבת שידור חוזר.",
    expAnalogy: "תחשוב על שיחה במכשיר קשר (ווקי-טוקי): כשאתה לוחץ ומדבר, אתה לא יכול לשמוע את הצד השני, ואם שניכם תדברו יחד יישמע רק רעש מקוטע.",
    expOneLine: "Half-Duplex מאפשר העברת מידע לשני הכיוונים אך לא בו-זמנית, מה שעלול לגרום להתנגשויות."
  },
  {
    cat: "יסודות רשת ומודל OSI",
    q: "מה קורה כאשר מתג (Switch) מקבל מסגרת Unicast עם כתובת MAC יעד שאינה מופיעה בטבלת ה-MAC שלו?",
    options: ["הוא זורק את המסגרת מיד", "הוא מבצע Unknown Unicast Flooding ושולח אותה לכל הפורטים הפעילים באותו VLAN למעט הפורט שנכנסה ממנו", "הוא פונה לשרת ה-DNS", "הוא משבית את הפורט"],
    ans: 1,
    expSimple: "מכיוון שהמתג לא יודע לאיזה פורט לחבר את ההודעה, הוא מפיץ אותה לכל השכנים באותה רשת כדי שהיעד הנכון יוכל לענות לו.",
    expAnalogy: "תחשוב על מורה שנכנס לכיתה עם מחברת בלי שם של תלמיד אלא רק כינוי לא מוכר, וצועק בקול רם בכל הכיתה: 'למי שייכת המחברת הזו?' עד שהתלמיד הנכון מרים את היד.",
    expOneLine: "מתג שאינו מכיר את ה-MAC של היעד מציף את המסגרת בכל הפורטים של אותו VLAN חוץ מפורט המקור."
  },

  // נושא 2: כתובות IPv4, Subnetting ו-IPv6
  {
    cat: "כתובות IP, Subnetting ו-IPv6",
    q: "כמה כתובות מחשב שמישות (Usable Hosts) מספקת מסכת רשת 255.255.255.192 (/26)?",
    options: ["30", "62", "64", "126"],
    ans: 1,
    expSimple: "במסכה 26/ נותרו 6 ביטים עבור מחשבים. 2 בחזקת 6 שווה 64, ומפחיתים 2 כתובות (רשת וברודקאסט).",
    expAnalogy: "תחשוב על בניין דירות עם 64 חדרים, שבו החדר הראשון מוקדש למשרד הרישום והחדר האחרון ללוח המודעות הציבורי, כך שנותרו 62 חדרים למגורים.",
    expOneLine: "מסכת רשת 26/ מספקת 62 כתובות IP תקפות עבור התקני קצה."
  },
  {
    cat: "כתובות IP, Subnetting ו-IPv6",
    q: "מהי כתובת הרשת (Network ID) עבור הכתובת 172.16.50.12 במסכת 255.255.240.0 (/20)?",
    options: ["172.16.0.0", "172.16.32.0", "172.16.48.0", "172.16.50.0"],
    ans: 2,
    expSimple: "במסכה 20/ הקפיצות באוקטטה השלישית הן של 16 (256 פחות 240). הרשתות הן 0, 16, 32, 48, 64... הכתובת 50 שייכת לבלוק שמתחיל ב-48.",
    expAnalogy: "תחשוב על חלוקת ספר לפרקים של 16 עמודים כל אחד: עמוד 50 יימצא בתוך הפרק שמתחיל בעמוד 48.",
    expOneLine: "כתובת הרשת עבור 172.16.50.12/20 היא 172.16.48.0."
  },
  {
    cat: "כתובות IP, Subnetting ו-IPv6",
    q: "איזה סוג כתובת IPv6 מתחיל תמיד בקידומת fe80::/10?",
    options: ["Global Unicast", "Link-Local", "Unique Local", "Multicast"],
    ans: 1,
    expSimple: "כתובת Link-Local משמשת לתקשורת פנימית מקומית על גבי אותו כבל או מקטע רשת יחיד ואינה מנותבת החוצה.",
    expAnalogy: "תחשוב על שיחה בלחישה בין שני אנשים שיושבים באותו חדר: היא עובדת מעולה בתוך החדר, אבל אי אפשר להעביר אותה לבניין הסמוך.",
    expOneLine: "הקידומת fe80::/10 מוגדרת עבור כתובות IPv6 מסוג Link-Local לתקשורת במקטע המקומי בלבד."
  },

  // נושא 3: VLANs, Trunks ו-Inter-VLAN
  {
    cat: "VLANs ו-Inter-VLAN Routing",
    q: "מהו התפקיד של פרוטוקול IEEE 802.1Q בחיבורי Trunk בין מתגים?",
    options: ["להצפין תעבורה", "להוסיף תגית בת 4 בתים לכותרת המסגרת כדי לזהות לאיזה VLAN היא שייכת", "לחסום פורטים עודפים", "לחלק כתובות IP"],
    ans: 1,
    expSimple: "הפרוטוקול מדביק 'מדבקה' קטנה עם מספר הרשת לכל פאקטה שיוצאת לכבל המשותף, כדי שהמתג בצד השני יידע לאן להעביר אותה.",
    expAnalogy: "תחשוב על ארגז משלוחים שבו שמים מעטפות ממספר מחלקות שונות ומדביקים על כל מעטפה מדבקה צבעונית שמציינת אם היא שייכת למחלקת כספים או שיווק.",
    expOneLine: "תקן 802.1Q מוסיף תג זיהוי של 4 בתים למסגרות Ethernet לצורך הפרדת תנועה בין רשתות וירטואליות שונות."
  },
  {
    cat: "VLANs ו-Inter-VLAN Routing",
    q: "כיצד תעבורה השייכת ל-Native VLAN מועברת על גבי קו 802.1Q Trunk?",
    options: ["ללא תיוג כלל (Untagged)", "עם תיוג מוצפן", "במהירות מוגבלת של 10Mbps", "היא אינה מורשית לעבור"],
    ans: 0,
    expSimple: "המתג מעביר מידע של Native VLAN בדיוק כפי שהוא, בלי להדביק עליו תג זיהוי של 802.1Q.",
    expAnalogy: "תחשוב על קו חלוקת מכתבים שבו כל מכתב מיוחד מקבל בול צבעוני, חוץ מהדואר הכללי של עיריית המקום שנשלח במעטפה חלקה רגילה.",
    expOneLine: "תעבורת Native VLAN מועברת על קו Trunk ללא שום תיוג 802.1Q כדי לשמור על תאימות."
  },
  {
    cat: "VLANs ו-Inter-VLAN Routing",
    q: "מהו החיסרון המרכזי של תצורת Router-on-a-Stick בהשוואה למתג שכבה 3 (Multilayer Switch)?",

let currentQuestions = [];
let userSelections = {};
let timerInterval = null;
let secondsRemaining = 0;

function initSetup() {
  const categories = [...new Set(questionBank.map(q => q.cat))];
  const container = document.getElementById('category-selectors');
  container.innerHTML = '';

  categories.forEach(cat => {
    const label = document.createElement('label');
    label.className = 'checkbox-label';
    label.innerHTML = `
      <input type="checkbox" name="selected-cat" value="${cat}" checked>
      ${cat}
    `;
    container.appendChild(label);
  });
}

function selectAllCategories(state) {
  document.querySelectorAll('input[name="selected-cat"]').forEach(cb => cb.checked = state);
}

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startExam() {
  const checkedBoxes = Array.from(document.querySelectorAll('input[name="selected-cat"]:checked')).map(cb => cb.value);
  if (checkedBoxes.length === 0) {
    alert('אנא בחר לפחות נושא אחד למבחן.');
    return;
  }

  let filtered = questionBank.filter(q => checkedBoxes.includes(q.cat));

  const countChoice = document.querySelector('input[name="q-count"]:checked').value;
  let targetCount = countChoice === 'all' ? filtered.length : parseInt(countChoice);

  // מנגנון שכפול חכם לדגימה אקראית אם נבחר מספר גבוה ממאגר הבסיס
  let pool = [...filtered];
  while (pool.length < targetCount) {
    pool = pool.concat(filtered);
  }

  currentQuestions = shuffleArray(pool).slice(0, targetCount);
  userSelections = {};

  const timeLimitMinutes = parseInt(document.querySelector('input[name="time-limit"]:checked').value);
  if (timeLimitMinutes > 0) {
    secondsRemaining = timeLimitMinutes * 60;
    startTimer();
  } else {
    document.getElementById('timer-display').textContent = 'ללא הגבלה';
  }

  document.getElementById('setup-view').style.display = 'none';
  document.getElementById('exam-view').style.display = 'block';
  document.getElementById('result-view').style.display = 'none';

  renderExamQuestions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startTimer() {
  clearInterval(timerInterval);
  updateTimerDisplay();

  timerInterval = setInterval(() => {
    secondsRemaining--;
    updateTimerDisplay();

    if (secondsRemaining <= 0) {
      clearInterval(timerInterval);
      alert('הזמן המוקצב למבחן הסתיים!');
      finishExam();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(secondsRemaining / 60);
  const secs = secondsRemaining % 60;
  document.getElementById('timer-display').textContent = 
    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function renderExamQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  document.getElementById('progress-counter').textContent = `סה"כ שאלות במבחן: ${currentQuestions.length}`;
  updateAnsweredCounter();

  currentQuestions.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-card-${index}`;

    let html = `
      <div class="question-category">${item.cat}</div>
      <div class="question-header">${index + 1}. ${item.q}</div>
    `;

    if (item.isLab && item.diagramHtml) {
      html += item.diagramHtml;
    }

    html += `<div class="options-list">`;
    const letters = ['א', 'ב', 'ג', 'ד'];

    item.options.forEach((opt, optIdx) => {
      html += `
        <div class="option-item" id="opt-${index}-${optIdx}" onclick="selectAnswer(${index}, ${optIdx})">
          <span style="font-weight:700; margin-left:8px;">${letters[optIdx]}.</span>
          <span>${opt}</span>
        </div>
      `;
    });

    html += `</div>`;
    
    // תיבת הסבר מובנית לפי 3 חלקים
    html += `
      <div class="explanation-box" id="exp-${index}">
        <div class="explanation-section">
          <strong>א) הסבר פשוט:</strong>
          <span>${item.expSimple}</span>
        </div>
        <div class="explanation-section">
          <strong>ב) דוגמה מהחיים האמיתיים:</strong>
          <span>${item.expAnalogy}</span>
        </div>
        <div class="explanation-section">
          <strong>ג) הסבר של שורה אחת:</strong>
          <span>${item.expOneLine}</span>
        </div>
      </div>
    `;

    card.innerHTML = html;
    container.appendChild(card);
  });
}

function selectAnswer(qIndex, optIndex) {
  userSelections[qIndex] = optIndex;

  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qIndex}-${i}`);
    if (el) el.classList.remove('selected');
  }

  const selectedEl = document.getElementById(`opt-${qIndex}-${optIndex}`);
  if (selectedEl) selectedEl.classList.add('selected');

  updateAnsweredCounter();
}

function updateAnsweredCounter() {
  const answered = Object.keys(userSelections).length;
  document.getElementById('answered-counter').textContent = `נענו: ${answered} מתוך ${currentQuestions.length}`;
}

function finishExam() {
  clearInterval(timerInterval);

  let score = 0;
  currentQuestions.forEach((q, idx) => {
    const userAns = userSelections[idx];
    const isCorrect = userAns === q.ans;
    if (isCorrect) score++;

    for (let i = 0; i < q.options.length; i++) {
      const optEl = document.getElementById(`opt-${idx}-${i}`);
      if (optEl) {
        optEl.onclick = null;
        if (i === q.ans) {
          optEl.classList.add('is-correct');
        } else if (i === userAns && !isCorrect) {
          optEl.classList.add('is-wrong');
        }
      }
    }

    const expEl = document.getElementById(`exp-${idx}`);
    if (expEl) expEl.style.display = 'block';
  });

  const percentage = Math.round((score / currentQuestions.length) * 100);

  document.getElementById('exam-view').style.display = 'none';
  document.getElementById('result-view').style.display = 'block';

  document.getElementById('final-score').textContent = `${percentage}%`;
  document.getElementById('results-summary').textContent = 
    `ענית נכון על ${score} מתוך ${currentQuestions.length} שאלות שנבדקו.`;

  const reviewContainer = document.getElementById('review-container');
  reviewContainer.innerHTML = '';
  const questionsClone = document.getElementById('questions-container').cloneNode(true);
  reviewContainer.appendChild(questionsClone);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  document.getElementById('result-view').style.display = 'none';
  document.getElementById('setup-view').style.display = 'block';
  document.getElementById('timer-display').textContent = '--:--';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = initSetup;
