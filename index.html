<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA Simulator - מתחם תרגול והסמכה ברשתות</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    :root {
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --secondary: #0f766e;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #166534;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Assistant', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 24px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 800;
    }

    header p {
      font-size: 14px;
      color: #bfdbfe;
      margin-top: 4px;
    }

    .timer-badge {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .content-area {
      padding: 30px;
    }

    /* מסך הגדרות */
    .setup-section {
      margin-bottom: 25px;
    }

    .setup-section h3 {
      font-size: 17px;
      margin-bottom: 12px;
      color: var(--primary);
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 6px;
    }

    .grid-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .checkbox-label, .radio-label {
      display: flex;
      align-items: center;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .checkbox-label:hover, .radio-label:hover {
      background: var(--primary-light);
      border-color: #bfdbfe;
    }

    input[type="checkbox"], input[type="radio"] {
      margin-left: 10px;
      accent-color: var(--primary);
    }

    .btn-main {
      display: block;
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 25px;
    }

    .btn-main:hover {
      background: var(--primary-hover);
    }

    /* מסך מבחן */
    .exam-progress {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .question-card {
      margin-bottom: 25px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    .question-header {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #1e293b;
    }

    .question-category {
      display: inline-block;
      font-size: 11px;
      background: #f1f5f9;
      color: #475569;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: #fafafa;
      font-size: 14px;
      transition: all 0.15s;
    }

    .option-item:hover {
      background: #f1f5f9;
    }

    .option-item.selected {
      background: var(--primary-light);
      border-color: #3b82f6;
      font-weight: 600;
    }

    .option-item.is-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text);
      font-weight: 700;
    }

    .option-item.is-wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text);
    }

    .explanation-box {
      margin-top: 12px;
      padding: 12px 16px;
      background: #f8fafc;
      border-right: 4px solid var(--primary);
      border-radius: 4px;
      font-size: 13.5px;
      display: none;
    }

    /* עיצוב מעבדות בסגנון Packet Tracer */
    .pt-diagram {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 12px;
      margin: 12px 0;
      direction: ltr;
    }

    .pt-bar {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 8px;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 4px;
    }

    /* תוצאות */
    .results-card {
      text-align: center;
      padding: 30px;
      background: #f0fdf4;
      border: 2px solid #22c55e;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .results-card h2 {
      color: #15803d;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .score-circle {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
      margin: 15px 0;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>CCNA Practice Lab & Exam Simulator</h1>
      <p>סימולטור מבחני רשתות מקיף לפי נושאים</p>
    </div>
    <div class="timer-badge" id="timer-display">--:--</div>
  </header>

  <div class="content-area">
    <!-- מסך הגדרות מבחן -->
    <div id="setup-view">
      <div class="setup-section">
        <h3>1. בחר כמות שאלות במבחן</h3>
        <div class="grid-options">
          <label class="radio-label"><input type="radio" name="q-count" value="10"> 10 שאלות (מבחן מהיר)</label>
          <label class="radio-label"><input type="radio" name="q-count" value="20" checked> 20 שאלות (סטנדרטי)</label>
          <label class="radio-label"><input type="radio" name="q-count" value="30"> 30 שאלות (מעמיק)</label>
          <label class="radio-label"><input type="radio" name="q-count" value="all"> כל השאלות שנבחרו</label>
        </div>
      </div>

      <div class="setup-section">
        <h3>2. הגבלת זמן (טיימר)</h3>
        <div class="grid-options">
          <label class="radio-label"><input type="radio" name="time-limit" value="15"> 15 דקות</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="30" checked> 30 דקות</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="60"> 60 דקות</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="0"> ללא הגבלת זמן</label>
        </div>
      </div>

      <div class="setup-section">
        <h3>3. בחר נושאים למבחן</h3>
        <div style="margin-bottom: 10px;">
          <button type="button" onclick="selectAllCategories(true)" style="font-size: 12px; padding: 4px 8px; cursor: pointer;">בחר הכל</button>
          <button type="button" onclick="selectAllCategories(false)" style="font-size: 12px; padding: 4px 8px; cursor: pointer;">נקה הכל</button>
        </div>
        <div class="grid-options" id="category-selectors">
          <!-- נטען דינמית -->
        </div>
      </div>

      <button class="btn-main" onclick="startExam()">התחל מבחן עכשיו</button>
    </div>

    <!-- מסך שאלות המבחן -->
    <div id="exam-view" style="display: none;">
      <div class="exam-progress">
        <span id="progress-counter">שאלה 0 מתוך 0</span>
        <span id="answered-counter">נענו: 0</span>
      </div>

      <div id="questions-container"></div>

      <button class="btn-main" id="submit-btn" onclick="finishExam()">הגש מבחן ובדוק תוצאות</button>
    </div>

    <!-- מסך תוצאות -->
    <div id="result-view" style="display: none;">
      <div class="results-card" id="results-card">
        <h2>סיום המבחן!</h2>
        <div class="score-circle" id="final-score">0%</div>
        <p id="results-summary"></p>
        <button class="btn-main" style="max-width: 200px; margin: 20px auto 0 auto;" onclick="restart()">מבחן חדש</button>
      </div>

      <h3 style="margin-bottom: 15px; color: var(--primary);">פירוט תשובות והסברים:</h3>
      <div id="review-container"></div>
    </div>
  </div>
</div>

<script>
// מאגר שאלות מקיף לפי נושאי CCNA
const questionBank = [
  // נושא 1: יסודות שכבה 1-4 ו-OSI
  {
    cat: "יסודות רשת ומודל OSI",
    q: "באיזו שכבה במודל ה-OSI נקבעת כתובת ה-MAC ומתבצעת בדיקת תקינות מסגרת (FCS)?",
    options: ["שכבה 1 (Physical)", "שכבה 2 (Data Link)", "שכבה 3 (Network)", "שכבה 4 (Transport)"],
    ans: 1,
    exp: "שכבה 2 (Data Link) אחראית על כתובות פיזיות (MAC), בקרת גישה לתווך ובדיקת שלמות בעזרת CRC/FCS."
  },
  {
    cat: "יסודות רשת ומודל OSI",
    q: "מהו ההבדל המרכזי בין פרוטוקול TCP לפרוטוקול UDP?",
    options: [
      "TCP מבוסס חיבור ומבטיח הגעת מידע (Reliable), בעוד UDP פועל בשיטת Best-effort ללא אישורים.",
      "UDP מבצע חלוקת עומסים ו-TCP לא.",
      "TCP פועל בשכבה 3 ו-UDP פועל בשכבה 4.",
      "UDP מצפין את הנתונים כברירת מחדל ו-TCP לא."
    ],
    ans: 0,
    exp: "TCP כולל לחיצת יד משולשת, אישורי קבלה ושידור חוזר, בעוד UDP קל ומהיר יותר אך אינו מוודא הגעה."
  },
  {
    cat: "יסודות רשת ומודל OSI",
    q: "מה קורה לערך שדה ה-TTL (Time to Live) כאשר פאקטה עוברת דרך נתב (Router)?",
    options: ["הוא מוכפל ב-2", "הוא מופחת ב-1", "הוא עולה ב-1", "הוא נשאר ללא שינוי"],
    ans: 1,
    exp: "כל נתב שמנתב פאקטה מוריד את ה-TTL ב-1 כדי למנוע לולאות אינסופיות ברשת שכבה 3."
  },
  {
    cat: "יסודות רשת ומודל OSI",
    q: "מה מאפיין כבל סיב אופטי מסוג Single-Mode בהשוואה ל-Multi-Mode?",
    options: [
      "ליבה צרה מאוד המעבירה קרן לייזר אחת למרחקים ארוכים במיוחד.",
      "ליבה רחבה המשתמשת בנורות LED זולות לטווחים של מטרים בודדים.",
      "הוא אינו תומך ברוחב פס של מעל 100Mbps.",
      "הוא עשוי מנחושת מצופה זכוכית."
    ],
    ans: 0,
    exp: "ל-Single-Mode ליבה דקה (כ-9 מיקרון) והוא מונע פיזור אות, מה שמאפשר שידור למרחקים של עשרות קילומטרים."
  },

  // נושא 2: Subnetting ו-IPv4
  {
    cat: "כתובות IP ו-Subnetting",
    q: "כמה כתובות מחשב תקפות (Usable Hosts) מספקת מסכת רשת 255.255.255.240 (/28)?",
    options: ["6", "14", "16", "30"],
    ans: 1,
    exp: "במסכה 28/ נותרו 4 ביטים למארחים: 2 בחזקת 4 פחות 2 שווה 14 כתובות שמישות."
  },
  {
    cat: "כתובות IP ו-Subnetting",
    q: "מהי כתובת הרשת (Network Address) של המחשב 192.168.10.70/26?",
    options: ["192.168.10.0", "192.168.10.32", "192.168.10.64", "192.168.10.128"],
    ans: 2,
    exp: "במסכה 26/ גודל הבלוק הוא 64. הרשתות הן 0, 64, 128... הכתובת 70 נמצאת ברשת 192.168.10.64."
  },
  {
    cat: "כתובות IP ו-Subnetting",
    q: "מהי כתובת ה-Broadcast של תת-הרשת 10.1.2.0/23?",
    options: ["10.1.2.255", "10.1.3.255", "10.1.4.255", "10.1.255.255"],
    ans: 1,
    exp: "מסכה 23/ מקבצת 2 רשתות של 24/. הרשת מתחילה ב-10.1.2.0 ומסתיימת ב-10.1.3.255."
  },
  {
    cat: "כתובות IP ו-Subnetting",
    q: "איזו מסכת רשת נדרשת עבור חיבור Point-to-Point בין שני נתבים כדי למנוע כל בזבוז כתובות?",
    options: ["255.255.255.0 (/24)", "255.255.255.248 (/29)", "255.255.255.252 (/30)", "255.255.255.254 (/31)"],
    ans: 3,
    exp: "תקן RFC 3021 מאפשר מסכה 31/ בחיבורי נקודה-לנקודה ללא כתובות רשת וברודקאסט מסורתיות (2 כתובות בדיוק). גם 30/ מספק 2 כתובות שמישות אך 31/ חסכוני יותר."
  },

  // נושא 3: VLANs, Trunks ו-Inter-VLAN
  {
    cat: "VLANs ו-Inter-VLAN Routing",
    q: "מהו תפקידו של ה-Native VLAN בקו תקשורת מסוג 802.1Q Trunk?",
    options: [
      "להצפין תעבורה רגישה ברשת.",
      "להעביר תנועה ללא תיוג (Untagged) עבור תאימות לציוד שאינו מזהה תגי 802.1Q.",
      "לשמש כרשת יחידה עבור תעבורת ניהול בלבד.",
      "לחסום תעבורת Broadcast בין מתגים."
    ],
    ans: 1,
    exp: "מסגרות השייכות ל-Native VLAN מועברות על קו Trunk ללא הוספת תג 802.1Q של 4 בתים."
  },
  {
    cat: "VLANs ו-Inter-VLAN Routing",
    q: "מה נדרש להגדיר בנתב בתצורת Router-on-a-Stick (ROAS) כדי לאפשר ניתוב עבור מספר רשתות וירטואליות?",
    options: [
      "תת-ממשקים (Sub-interfaces) עם הפקודה encapsulation dot1q.",
      "הפעלת פרוטוקול OSPF בלבד על הממשק הפיזי.",
      "חיבור כבל נפרד מהראוטר עבור כל פורט במתג.",
      "הגדרת PortFast על ממשק הראוטר."
    ],
    ans: 0,
    exp: "ב-ROAS מפצלים ממשק פיזי יחיד לתת-ממשקים לוגיים, ומגדירים על כל אחד מהם תיוג dot1q וכתובת Gateway."
  },
  {
    cat: "VLANs ו-Inter-VLAN Routing",
    q: "איזה ממשק וירטואלי במתג Multilayer (L3 Switch) משמש כשער ברירת מחדל (Default Gateway) עבור VLAN?",
    options: ["Loopback Interface", "SVI (Switched Virtual Interface)", "Null0", "Tunnel Interface"],
    ans: 1,
    exp: "ממשק SVI (המוגדר באמצעות `interface vlan X`) מספק כתובת IP לניהול וניתוב ברמת ה-VLAN."
  },

  // נושא 4: איגוד קישורים (EtherChannel)
  {
    cat: "איגוד קישורים (EtherChannel)",
    q: "איזה פרוטוקול הוא התקן הפתוח (IEEE Standard) להקמת EtherChannel דינמי?",
    options: ["PAgP (802.3ah)", "LACP (802.3ad / 802.1AX)", "DTP", "VTP"],
    ans: 1,
    exp: "LACP הוא תקן בינלאומי פתוח, בניגוד ל-PAgP שהוא פרוטוקול קנייני של סיסקו."
  },
  {
    cat: "איגוד קישורים (EtherChannel)",
    q: "אם צד אחד מוגדר LACP Desirable והצד השני LACP Auto, מה יקרה לחיבור?",
    options: [
      "החיבור ייכשל כי Desirable ו-Auto שייכים לפרוטוקול PAgP ולא ל-LACP.",
      "החיבור יוקם בהצלחה כ-EtherChannel.",
      "הפורטים ייכנסו למצב err-disable.",
      "החיבור יעבוד כקו Trunk בודד."
    ],
    ans: 0,
    exp: "המונחים Desirable ו-Auto שייכים לפרוטוקול PAgP. ב-LACP המצבים נקראים Active ו-Passive."
  },
  {
    cat: "איגוד קישורים (EtherChannel)",
    q: "כיצד פרוטוקול Spanning Tree (STP) מתייחס לערוץ EtherChannel מוגדר ותקין?",
    options: [
      "כממשק לוגי אחד בודד בעל עלות (Cost) נמוכה יותר.",
      "הוא חוסם את כל הפורטים חוץ מהראשון.",
      "הוא מתעלם ממנו ולא מגן עליו מפני לולאות.",
      "הוא מחלק אותו למספר עצים נפרדים."
    ],
    ans: 0,
    exp: "STP רואה את כל הפורטים המאוגדים כממשק לוגי יחיד (Port-channel), ובכך נמנעת חסימה של קווים כפולים."
  },

  // נושא 5: Spanning Tree Protocol (STP & RSTP)
  {
    cat: "Spanning Tree Protocol (STP)",
    q: "מהו סדר שבירת השוויון בבחירת Root Bridge ב-STP כאשר לשני מתגים יש אותו Priority?",
    options: [
      "כתובת ה-IP הגבוהה ביותר.",
      "כתובת ה-MAC הנמוכה ביותר.",
      "מספר הפורטים הפעילים.",
      "המתג שפועל הכי הרבה זמן ברציפות."
    ],
    ans: 1,
    exp: "ה-Bridge ID מורכב מ-Priority וכתובת MAC. אם ה-Priority זהה, כתובת ה-MAC הנמוכה ביותר מכריעה."
  },
  {
    cat: "Spanning Tree Protocol (STP)",
    q: "מה תפקיד התכונה PortFast במתגי סיסקו?",
    options: [
      "להעביר פורט גישה (Access) ישירות למצב Forwarding תוך דילוג על מצבי Listening ו-Learning.",
      "להאיץ את מהירות הפורט מ-1Gbps ל-10Gbps.",
      "לחסום הודעות שידור לא רצויות.",
      "להפוך פורט גישה ל-Trunk באופן אוטומטי."
    ],
    ans: 0,
    exp: "PortFast מיועד לחיבורי מחשבי קצה בלבד כדי שלא ימתינו 30 שניות לקבלת כתובת IP וחיבור לרשת."
  },
  {
    cat: "Spanning Tree Protocol (STP)",

// ניהול מצב האפליקציה
let currentQuestions = [];
let userSelections = {};
let timerInterval = null;
let secondsRemaining = 0;

// אתחול קטגוריות במסך הגדרות
function initSetup() {
  const categories = [...new Set(questionBank.map(q => q.cat))];
  const container = document.getElementById('category-selectors');
  container.innerHTML = '';

  categories.forEach(cat => {
    const label = document.createElement('label');
    label.className = 'checkbox-label';
    label.innerHTML = `
      <input type="checkbox" name="selected-cat" value="${cat}" checked>
      ${cat}
    `;
    container.appendChild(label);
  });
}

function selectAllCategories(state) {
  document.querySelectorAll('input[name="selected-cat"]').forEach(cb => cb.checked = state);
}

// ערבוב שאלות ואפשרויות
function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startExam() {
  const checkedBoxes = Array.from(document.querySelectorAll('input[name="selected-cat"]:checked')).map(cb => cb.value);
  if (checkedBoxes.length === 0) {
    alert('אנא בחר לפחות נושא אחד למבחן.');
    return;
  }

  // סינון שאלות לפי נושאים שנבחרו
  let filtered = questionBank.filter(q => checkedBoxes.includes(q.cat));

  // בחירת כמות שאלות
  const countChoice = document.querySelector('input[name="q-count"]:checked').value;
  const numQuestions = countChoice === 'all' ? filtered.length : Math.min(parseInt(countChoice), filtered.length);

  // ערבוב מאגר ובחירת תת-קבוצה אקראית
  currentQuestions = shuffleArray(filtered).slice(0, numQuestions);
  userSelections = {};

  // הגדרת טיימר
  const timeLimitMinutes = parseInt(document.querySelector('input[name="time-limit"]:checked').value);
  if (timeLimitMinutes > 0) {
    secondsRemaining = timeLimitMinutes * 60;
    startTimer();
  } else {
    document.getElementById('timer-display').textContent = 'ללא הגבלה';
  }

  // הצגת מסך המבחן
  document.getElementById('setup-view').style.display = 'none';
  document.getElementById('exam-view').style.display = 'block';
  document.getElementById('result-view').style.display = 'none';

  renderExamQuestions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startTimer() {
  clearInterval(timerInterval);
  updateTimerDisplay();

  timerInterval = setInterval(() => {
    secondsRemaining--;
    updateTimerDisplay();

    if (secondsRemaining <= 0) {
      clearInterval(timerInterval);
      alert('הזמן המוקצב למבחן הסתיים!');
      finishExam();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(secondsRemaining / 60);
  const secs = secondsRemaining % 60;
  document.getElementById('timer-display').textContent = 
    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function renderExamQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  document.getElementById('progress-counter').textContent = `סה"כ שאלות במבחן: ${currentQuestions.length}`;
  updateAnsweredCounter();

  currentQuestions.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-card-${index}`;

    let html = `
      <div class="question-category">${item.cat}</div>
      <div class="question-header">${index + 1}. ${item.q}</div>
    `;

    if (item.isLab && item.diagramHtml) {
      html += item.diagramHtml;
    }

    html += `<div class="options-list">`;
    const letters = ['א', 'ב', 'ג', 'ד'];

    item.options.forEach((opt, optIdx) => {
      html += `
        <div class="option-item" id="opt-${index}-${optIdx}" onclick="selectAnswer(${index}, ${optIdx})">
          <span style="font-weight:700; margin-left:8px;">${letters[optIdx]}.</span>
          <span>${opt}</span>
        </div>
      `;
    });

    html += `</div>`;
    html += `<div class="explanation-box" id="exp-${index}"><strong>הסבר מקצועי:</strong> ${item.exp}</div>`;

    card.innerHTML = html;
    container.appendChild(card);
  });
}

function selectAnswer(qIndex, optIndex) {
  userSelections[qIndex] = optIndex;

  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qIndex}-${i}`);
    if (el) el.classList.remove('selected');
  }

  const selectedEl = document.getElementById(`opt-${qIndex}-${optIndex}`);
  if (selectedEl) selectedEl.classList.add('selected');

  updateAnsweredCounter();
}

function updateAnsweredCounter() {
  const answered = Object.keys(userSelections).length;
  document.getElementById('answered-counter').textContent = `נענו: ${answered} מתוך ${currentQuestions.length}`;
}

function finishExam() {
  clearInterval(timerInterval);

  let score = 0;
  currentQuestions.forEach((q, idx) => {
    const userAns = userSelections[idx];
    const isCorrect = userAns === q.ans;
    if (isCorrect) score++;

    // צביעת תוצאות
    for (let i = 0; i < q.options.length; i++) {
      const optEl = document.getElementById(`opt-${idx}-${i}`);
      if (optEl) {
        optEl.onclick = null; // ביטול לחיצה לאחר הגשה
        if (i === q.ans) {
          optEl.classList.add('is-correct');
        } else if (i === userAns && !isCorrect) {
          optEl.classList.add('is-wrong');
        }
      }
    }

    const expEl = document.getElementById(`exp-${idx}`);
    if (expEl) expEl.style.display = 'block';
  });

  const percentage = Math.round((score / currentQuestions.length) * 100);

  document.getElementById('exam-view').style.display = 'none';
  document.getElementById('result-view').style.display = 'block';

  document.getElementById('final-score').textContent = `${percentage}%`;
  document.getElementById('results-summary').textContent = 
    `ענית נכון על ${score} מתוך ${currentQuestions.length} שאלות שנבדקו.`;

  // העברת פירוט השאלות לתחתית עמוד התוצאות
  const reviewContainer = document.getElementById('review-container');
  reviewContainer.innerHTML = '';
  const questionsClone = document.getElementById('questions-container').cloneNode(true);
  reviewContainer.appendChild(questionsClone);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  document.getElementById('result-view').style.display = 'none';
  document.getElementById('setup-view').style.display = 'block';
  document.getElementById('timer-display').textContent = '--:--';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = initSetup;
</script>
