<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA Simulator - PingMyNetwork Curriculum</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    :root {
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --secondary: #0f766e;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #166534;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #991b1b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Assistant', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 24px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    header h1 { font-size: 24px; font-weight: 800; }
    header p { font-size: 14px; color: #bfdbfe; margin-top: 4px; }

    .timer-badge {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
    }

    .content-area { padding: 30px; }

    .setup-section { margin-bottom: 25px; }

    .setup-section h3 {
      font-size: 17px;
      margin-bottom: 12px;
      color: var(--primary);
      border-bottom: 2px solid var(--primary-light);
      padding-bottom: 6px;
    }

    .grid-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .topics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 8px;
      max-height: 480px;
      overflow-y: auto;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .checkbox-label, .radio-label {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 13.5px;
      transition: all 0.2s;
      user-select: none;
    }

    .checkbox-label:hover, .radio-label:hover {
      background: var(--primary-light);
      border-color: #bfdbfe;
    }

    input[type="checkbox"], input[type="radio"] {
      margin-left: 10px;
      accent-color: var(--primary);
    }

    .btn-main {
      display: block;
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 25px;
    }

    .btn-main:hover { background: var(--primary-hover); }

    .exam-progress {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .question-card {
      margin-bottom: 25px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    .question-category {
      display: inline-block;
      font-size: 12px;
      background: #f1f5f9;
      color: #334155;
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-weight: 700;
      border-right: 3px solid var(--primary);
    }

    .question-header {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #1e293b;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: #fafafa;
      font-size: 14px;
      transition: all 0.15s;
    }

    .option-item:hover { background: #f1f5f9; }

    .option-item.selected {
      background: var(--primary-light);
      border-color: #3b82f6;
      font-weight: 600;
    }

    .option-item.is-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text);
      font-weight: 700;
    }

    .option-item.is-wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text);
    }

    .explanation-box {
      margin-top: 15px;
      padding: 16px;
      background: #f8fafc;
      border-right: 4px solid var(--primary);
      border-radius: 6px;
      font-size: 14px;
      display: none;
      line-height: 1.6;
    }

    .explanation-section { margin-bottom: 8px; }
    .explanation-section:last-child { margin-bottom: 0; }
    .explanation-section strong {
      color: var(--primary);
      display: block;
      margin-bottom: 2px;
    }

    .results-card {
      text-align: center;
      padding: 30px;
      background: #f0fdf4;
      border: 2px solid #22c55e;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .results-card h2 { color: #15803d; font-size: 28px; margin-bottom: 8px; }

    .score-circle {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
      margin: 15px 0;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>CCNA Exam Simulator</h1>
      <p>תרגול והכנה למבחן לפי 37 נושאי PingMyNetwork הרשמיים</p>
    </div>
    <div class="timer-badge" id="timer-display">--:--</div>
  </header>

  <div class="content-area">
    <!-- מסך הגדרות -->
    <div id="setup-view">
      <div class="setup-section">
        <h3>1. בחר כמות שאלות במבחן</h3>
        <div class="grid-options">
          <label class="radio-label"><input type="radio" name="q-count" value="10"> 10 שאלות</label>
          <label class="radio-label"><input type="radio" name="q-count" value="25"> 25 שאלות</label>
          <label class="radio-label"><input type="radio" name="q-count" value="50" checked> 50 שאלות</label>
          <label class="radio-label"><input type="radio" name="q-count" value="100"> 100 שאלות (מבחן מלא)</label>
          <label class="radio-label"><input type="radio" name="q-count" value="all"> כל השאלות שנבחרו</label>
        </div>
      </div>

      <div class="setup-section">
        <h3>2. הגבלת זמן (טיימר)</h3>
        <div class="grid-options">
          <label class="radio-label"><input type="radio" name="time-limit" value="15"> 15 דקות</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="30"> 30 דקות</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="60"> 60 דקות</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="120" checked> 120 דקות (תואם CCNA)</label>
          <label class="radio-label"><input type="radio" name="time-limit" value="0"> ללא הגבלת זמן</label>
        </div>
      </div>

      <div class="setup-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3>3. בחר נושאים למבחן (37 נושאי PingMyNetwork)</h3>
          <div>
            <button type="button" onclick="selectAllTopics(true)" style="font-size: 12px; padding: 4px 8px; cursor: pointer;">בחר הכל</button>
            <button type="button" onclick="selectAllTopics(false)" style="font-size: 12px; padding: 4px 8px; cursor: pointer;">נקה הכל</button>
          </div>
        </div>
        <div class="topics-grid" id="topics-container"></div>
      </div>

      <button class="btn-main" onclick="startExam()">התחל מבחן עכשיו</button>
    </div>

    <!-- מסך שאלות -->
    <div id="exam-view" style="display: none;">
      <div class="exam-progress">
        <span id="progress-counter">שאלה 0 מתוך 0</span>
        <span id="answered-counter">נענו: 0</span>
      </div>

      <div id="questions-container"></div>

      <button class="btn-main" id="submit-btn" onclick="finishExam()">הגש מבחן ובדוק תוצאות</button>
    </div>

    <!-- מסך תוצאות -->
    <div id="result-view" style="display: none;">
      <div class="results-card" id="results-card">
        <h2>סיום המבחן!</h2>
        <div class="score-circle" id="final-score">0%</div>
        <p id="results-summary"></p>
        <button class="btn-main" style="max-width: 200px; margin: 20px auto 0 auto;" onclick="restart()">מבחן חדש</button>
      </div>

      <h3 style="margin-bottom: 15px; color: var(--primary);">פירוט תשובות והסברים לפי 3 חלקים:</h3>
      <div id="review-container"></div>
    </div>
  </div>
</div>

let currentQuestions = [];
let userSelections = {};
let timerInterval = null;
let secondsRemaining = 0;

function initSetup() {
  const container = document.getElementById('topics-container');
  container.innerHTML = '';

  pingMyNetworkTopics.forEach((topicName, idx) => {
    const topicNumber = idx + 1;
    const label = document.createElement('label');
    label.className = 'checkbox-label';
    label.innerHTML = `
      <input type="checkbox" name="selected-topic" value="${topicNumber}" checked>
      <span>${topicName}</span>
    `;
    container.appendChild(label);
  });
}

function selectAllTopics(state) {
  document.querySelectorAll('input[name="selected-topic"]').forEach(cb => cb.checked = state);
}

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startExam() {
  const selectedTopics = Array.from(document.querySelectorAll('input[name="selected-topic"]:checked'))
                              .map(cb => parseInt(cb.value));

  if (selectedTopics.length === 0) {
    alert('אנא בחר לפחות נושא אחד למבחן.');
    return;
  }

  let filtered = questionBank.filter(q => selectedTopics.includes(q.topicId));

  if (filtered.length === 0) {
    alert('לא נמצאו שאלות התואמות לנושאים שנבחרו.');
    return;
  }

  const countChoice = document.querySelector('input[name="q-count"]:checked').value;
  let targetCount = countChoice === 'all' ? filtered.length : parseInt(countChoice);

  // שכפול חכם לדגימה אקראית אם נבחר מספר גבוה ממאגר השאלות הקיים
  let pool = [...filtered];
  while (pool.length < targetCount) {
    pool = pool.concat(filtered);
  }

  currentQuestions = shuffleArray(pool).slice(0, targetCount);
  userSelections = {};

  const timeLimitMinutes = parseInt(document.querySelector('input[name="time-limit"]:checked').value);
  if (timeLimitMinutes > 0) {
    secondsRemaining = timeLimitMinutes * 60;
    startTimer();
  } else {
    document.getElementById('timer-display').textContent = 'ללא הגבלה';
  }

  document.getElementById('setup-view').style.display = 'none';
  document.getElementById('exam-view').style.display = 'block';
  document.getElementById('result-view').style.display = 'none';

  renderExamQuestions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startTimer() {
  clearInterval(timerInterval);
  updateTimerDisplay();

  timerInterval = setInterval(() => {
    secondsRemaining--;
    updateTimerDisplay();

    if (secondsRemaining <= 0) {
      clearInterval(timerInterval);
      alert('הזמן המוקצב למבחן הסתיים!');
      finishExam();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(secondsRemaining / 60);
  const secs = secondsRemaining % 60;
  document.getElementById('timer-display').textContent = 
    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function renderExamQuestions() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  document.getElementById('progress-counter').textContent = `סה"כ שאלות במבחן: ${currentQuestions.length}`;
  updateAnsweredCounter();

  currentQuestions.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-card-${index}`;

    const topicTitle = pingMyNetworkTopics[item.topicId - 1] || "CCNA General";

    let html = `
      <div class="question-category">${topicTitle}</div>
      <div class="question-header">${index + 1}. ${item.q}</div>
    `;

    html += `<div class="options-list">`;
    const letters = ['א', 'ב', 'ג', 'ד'];

    item.options.forEach((opt, optIdx) => {
      html += `
        <div class="option-item" id="opt-${index}-${optIdx}" onclick="selectAnswer(${index}, ${optIdx})">
          <span style="font-weight:700; margin-left:8px;">${letters[optIdx]}.</span>
          <span>${opt}</span>
        </div>
      `;
    });

    html += `</div>`;
    
    // תיבת הסבר מובנית לפי 3 חלקים
    html += `
      <div class="explanation-box" id="exp-${index}">
        <div class="explanation-section">
          <strong>א) הסבר פשוט:</strong>
          <span>${item.expSimple}</span>
        </div>
        <div class="explanation-section">
          <strong>ב) דוגמה מהחיים האמיתיים:</strong>
          <span>${item.expAnalogy}</span>
        </div>
        <div class="explanation-section">
          <strong>ג) הסבר של שורה אחת:</strong>
          <span>${item.expOneLine}</span>
        </div>
      </div>
    `;

    card.innerHTML = html;
    container.appendChild(card);
  });
}

function selectAnswer(qIndex, optIndex) {
  userSelections[qIndex] = optIndex;

  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qIndex}-${i}`);
    if (el) el.classList.remove('selected');
  }

  const selectedEl = document.getElementById(`opt-${qIndex}-${optIndex}`);
  if (selectedEl) selectedEl.classList.add('selected');

  updateAnsweredCounter();
}

function updateAnsweredCounter() {
  const answered = Object.keys(userSelections).length;
  document.getElementById('answered-counter').textContent = `נענו: ${answered} מתוך ${currentQuestions.length}`;
}

function finishExam() {
  clearInterval(timerInterval);

  let score = 0;
  currentQuestions.forEach((q, idx) => {
    const userAns = userSelections[idx];
    const isCorrect = userAns === q.ans;
    if (isCorrect) score++;

    for (let i = 0; i < q.options.length; i++) {
      const optEl = document.getElementById(`opt-${idx}-${i}`);
      if (optEl) {
        optEl.onclick = null;
        if (i === q.ans) {
          optEl.classList.add('is-correct');
        } else if (i === userAns && !isCorrect) {
          optEl.classList.add('is-wrong');
        }
      }
    }

    const expEl = document.getElementById(`exp-${idx}`);
    if (expEl) expEl.style.display = 'block';
  });

  const percentage = Math.round((score / currentQuestions.length) * 100);

  document.getElementById('exam-view').style.display = 'none';
  document.getElementById('result-view').style.display = 'block';

  document.getElementById('final-score').textContent = `${percentage}%`;
  document.getElementById('results-summary').textContent = 
    `ענית נכון על ${score} מתוך ${currentQuestions.length} שאלות שנבדקו.`;

  const reviewContainer = document.getElementById('review-container');
  reviewContainer.innerHTML = '';
  const questionsClone = document.getElementById('questions-container').cloneNode(true);
  reviewContainer.appendChild(questionsClone);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  document.getElementById('result-view').style.display = 'none';
  document.getElementById('setup-view').style.display = 'block';
  document.getElementById('timer-display').textContent = '--:--';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = initSetup;
