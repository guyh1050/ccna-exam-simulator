DNS 53, NTP 123, SNMP 161/162, syslog 514 (UDP). DHCP 67/68.","show ntp status\nshow logging"],"Static Routing":["ip route <net> <mask> <next-hop>; default route 0.0.0.0 0.0.0.0.","show ip route static"],"REST & JSON":["CRUD = POST/GET/PUT-PATCH/DELETE. JSON: {} object, [] array.","—"],SDN:["Northbound = apps↔controller; southbound = controller↔devices.","—"],DHCP:["Relay broadcasts with helper-address on the client-side SVI.","ip helper-address 10.0.0.5"],"TCP/UDP":["TCP: Telnet, SSH, HTTP(S), FTP. UDP: DNS queries, DHCP, TFTP, SNMP, syslog.","—"]};

// ---- IOS simulator ----
const EX="enable configure terminal show running-config version ip interface brief vlan ping exit end disable".split(" ");
const CF="interface vlan router ospf ip route hostname no shutdown switchport mode access trunk allowed native port-security maximum violation channel-group active passive on standby priority preempt nat inside outside dhcp snooping trust address name description exit end show running-config brief".split(" ");
const vocab=s=>(s.mode=="user"||s.mode=="priv")?EX:CF;
const expand=(x,V)=>{if(!/^[a-z-]+$/.test(x)||V.includes(x))return x;return V.find(v=>v.startsWith(x))||x};
const norm=n=>{const m=n.match(/^([a-z-]+)(\d.*)$/i);if(!m)return n;const p=m[1].toLowerCase(),M={fa:"FastEthernet",gi:"GigabitEthernet",g:"GigabitEthernet",po:"Port-channel",lo:"Loopback"};const k=Object.keys(M).find(k=>p.startsWith(k));return k?M[k]+m[2]:n};
const PR={user:">",priv:"#",conf:"(config)#",if:"(config-if)#",vlan:"(config-vlan)#",ospf:"(config-router)#"};
const IFV=/^(switchport (mode (access|trunk)|access vlan \d+|trunk (allowed vlan|native vlan) [\d,-]+|port-security( maximum \d+| violation (shutdown|restrict|protect))?)|channel-group \d+ mode (active|passive|on|desirable|auto)|ip address \S+ \S+|standby \d+ (ip \S+|priority \d+|preempt)|ip nat (inside|outside)|ip dhcp snooping trust|no shutdown|shutdown|description .+)$/;
const SUB={if:IFV,vlan:/^name \S+$/,ospf:/^(network \S+ \S+ area \d+|router-id \S+|passive-interface \S+)$/};
const INV="% Invalid input detected at '^' marker.";
const mkState=h=>({mode:"user",host:h,ctx:"global",cfg:[]});
function showRun(s){const g={};s.cfg.forEach(l=>{const[c,x]=l.split("|");(g[c]=g[c]||[]).push(x)});let o=["!","hostname "+s.host];Object.keys(g).forEach(c=>{if(c=="global")g[c].forEach(x=>o.push(x));else{o.push("!");o.push(c);g[c].forEach(x=>o.push(" "+x))}});return o.concat(["!","end"]).join("\n")}
function run(raw,s){
 const t=raw.trim();if(!t)return["",s];
 const V=vocab(s);let l=t.split(/\s+/).map(x=>expand(x,V)).join(" "),n={...s,cfg:[...s.cfg]};
 if(l=="enable"&&s.mode=="user")return["",{...n,mode:"priv"}];
 if(l=="disable"&&s.mode=="priv")return["",{...n,mode:"user"}];
 if(/^show /.test(l)||/^ping /.test(l)){
  if(s.mode=="user"&&/running/.test(l))return[INV,s];
  if(/^show running-config/.test(l))return[showRun(s),s];
  if(/^show vlan brief/.test(l)){const v=s.cfg.filter(x=>x.startsWith("global|vlan ")).map(x=>x.split(" ")[1]);return["VLAN Name       Status    Ports\n---- ---------- --------- -----\n1    default    active\n"+[...new Set(v)].map(id=>{const nm=(s.cfg.find(x=>x.startsWith("vlan "+id+"|name "))||"").split("name ")[1]||"VLAN"+id.padStart(4,"0");const pt=s.cfg.filter(x=>x.includes("switchport access vlan "+id+"$")||x.endsWith("|switchport access vlan "+id)).map(x=>x.split("|")[0].replace("interface ","")).join(", ");return id.padEnd(5)+nm.padEnd(11)+"active    "+pt}).join("\n"),s]}
  if(/^show ip interface brief/.test(l)){const ifs=[...new Set(s.cfg.map(x=>x.split("|")[0]).filter(x=>x.startsWith("interface ")))];return["Interface              IP-Address   Status\n"+ifs.map(i=>{const ip=(s.cfg.find(x=>x.startsWith(i+"|ip address "))||"").split(" ")[2]||"unassigned";const up=s.cfg.includes(i+"|no shutdown");return i.slice(10).padEnd(22)+ip.padEnd(13)+(up?"up":"administratively down")}).join("\n"),s]}
  if(/^ping /.test(l))return["Type escape sequence to abort.\nSending 5, 100-byte ICMP Echos, timeout is 2 seconds:\n!!!!!\nSuccess rate is 100 percent (5/5)",s];
  return[INV,s];}
 if(s.mode=="priv"&&/^configure t/.test(l))return["Enter configuration commands, one per line.  End with CNTL/Z.",{...n,mode:"conf",ctx:"global"}];
 if(s.mode=="user"||s.mode=="priv"){return[l=="exit"?"":INV,l=="exit"?mkState(s.host):s]}
 if(l=="end")return["",{...n,mode:"priv",ctx:"global"}];
 if(l=="exit")return["",s.mode=="conf"?{...n,mode:"priv"}:{...n,mode:"conf",ctx:"global"}];
 const neg=/^no /.test(l),b=neg?l.slice(3):l;
 if(s.mode=="conf"||/^(interface|vlan|router) /.test(b)&&false){
  let m;
  if(m=b.match(/^hostname (\S+)$/))return["",{...n,host:m[1]}];
  if(m=b.match(/^interface (\S+)$/))return["",{...n,mode:"if",ctx:"interface "+norm(m[1])}];
  if(m=b.match(/^vlan (\d+)$/)){if(!n.cfg.includes("global|vlan "+m[1]))n.cfg.push("global|vlan "+m[1]);return["",{...n,mode:"vlan",ctx:"vlan "+m[1]}]}
  if(/^router ospf \d+$/.test(b))return["",{...n,mode:"ospf",ctx:b}];
  if(/^(ip route \S+ \S+ \S+|ip dhcp snooping( vlan [\d,-]+)?|ip nat inside source .+|ip nat pool .+)$/.test(b)){const e="global|"+b;n.cfg=neg?n.cfg.filter(x=>x!=e):[...n.cfg.filter(x=>x!=e),e];return["",n]}
  return[INV,s];}
 if(SUB[s.mode]&&SUB[s.mode].test(neg&&b!="shutdown"?b:l)||(neg&&b=="shutdown")){
  const e=s.ctx+"|"+(neg?b:l),key=(neg?b:l).split(" ").slice(0,3).join(" ");
  if(neg&&b!="shutdown"){n.cfg=n.cfg.filter(x=>x!=e);return["",n]}
  if(l=="shutdown"){n.cfg=n.cfg.filter(x=>x!=s.ctx+"|no shutdown")}
  else if(neg){n.cfg=n.cfg.filter(x=>x!=s.ctx+"|no shutdown");n.cfg.push(s.ctx+"|no shutdown");return["",n]}
  else{const pre=l.split(" ");const w=pre[0]=="standby"?3:pre[0]=="switchport"?(pre[1]=="port-security"?(pre.length==2?2:3):pre[1]=="trunk"?3:2):2;const k=pre.slice(0,w).join(" ");n.cfg=n.cfg.filter(x=>{if(!x.startsWith(s.ctx+"|"))return true;const c=x.slice(s.ctx.length+1);if(l=="switchport port-security")return c!=l;if(pre[0]=="description")return !c.startsWith("description");return c.split(" ").slice(0,w).join(" ")!=k});n.cfg.push(e)}
  return["",n]}
 return[INV,s];}
const gradeLab=(it,s)=>it.tasks.map(([tx,c,re,need])=>({tx,need,ok:s.cfg.some(l=>l.startsWith(c+"|")&&re.test(l.slice(c.length+1)))}));

function Terminal({it,ls,setLs}){
 const[inp,setInp]=useState(""),[hi,setHi]=useState(-1),hist=useRef([]),box=useRef();
 useEffect(()=>{box.current&&(box.current.scrollTop=1e9)},[ls]);
 const prompt=ls.s.host+PR[ls.s.mode];
 const submit=()=>{const[o,s]=run(inp,ls.s);hist.current.unshift(inp);setHi(-1);setLs({s,out:[...ls.out,prompt+" "+inp,...(o?[o]:[])]});setInp("")};
 const key=e=>{
  if(e.key=="Enter")submit();
  else if(e.key=="ArrowUp"){e.preventDefault();const i=Math.min(hi+1,hist.current.length-1);if(i>=0){setHi(i);setInp(hist.current[i])}}
  else if(e.key=="ArrowDown"){e.preventDefault();const i=hi-1;setHi(i);setInp(i<0?"":hist.current[i])}
  else if(e.key=="Tab"){e.preventDefault();const p=inp.split(" "),last=p.pop(),m=vocab(ls.s).find(v=>last&&v.startsWith(last));if(m){p.push(m);setInp(p.join(" ")+" ")}}
  else if(e.key=="?"){e.preventDefault();const last=inp.split(" ").pop(),V=vocab(ls.s),m=V.filter(v=>v.startsWith(last));setLs({...ls,out:[...ls.out,prompt+" "+inp+"?",m.join("  ")||INV]})}};
 return <div className="flex flex-col h-full bg-black rounded-lg border border-slate-800 mono text-sm" onClick={()=>document.getElementById("cli")?.focus()}>
  <div ref={box} className="flex-1 overflow-auto p-3 whitespace-pre-wrap text-emerald-300 min-h-[260px] max-h-[420px]">{ls.out.join("\n")}
   <div className="flex"><span>{prompt}&nbsp;</span><input id="cli" autoFocus spellCheck={false} autoComplete="off" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={key} className="flex-1 bg-transparent outline-none text-emerald-200"/></div></div>
  <div className="px-3 py-1 text-[11px] text-slate-500 border-t border-slate-800">Tab complete · ? help · ↑↓ history · try: enable → conf t</div></div>}

function Dnd({it,val,set,show}){
 const[sel,setSel]=useState(null);
 const put=(j,z)=>{const v={...val};if(z==null)delete v[j];else v[j]=z;set(v);setSel(null)};
 const chip=j=><span key={j} draggable onDragStart={e=>e.dataTransfer.setData("t",String(j))} onClick={e=>{e.stopPropagation();setSel(sel===j?null:j)}} className={"inline-block m-1 px-2 py-1 rounded border cursor-grab text-sm bg-slate-800 "+(show?(val[j]===it.map[j]?"border-emerald-500":"border-rose-500"):"border-cyan-500")+(sel===j?" ring-2 ring-cyan-300":"")}>{it.items[j]}</span>;
 const dz=z=>({onDragOver:e=>e.preventDefault(),onDrop:e=>{e.preventDefault();put(+e.dataTransfer.getData("t"),z)},onClick:()=>sel!=null&&put(sel,z)});
 return <div className="bg-slate-900 border border-slate-800 rounded-lg p-4 space-y-3"><p className="text-white">{it.q} <span className="text-xs text-slate-400">(drag items, or tap an item then a box)</span></p>
  <div {...dz()} className="min-h-[44px] p-2 rounded bg-slate-950 border border-dashed border-slate-600">{it.items.map((_,j)=>val[j]==null&&chip(j))}</div>
  {it.zones.map((z,k)=><div key={k} {...dz(k)} className="p-2 rounded border border-slate-700 min-h-[48px]"><div className="text-xs text-slate-400">{z}</div>{it.items.map((_,j)=>val[j]===k&&chip(j))}</div>)}</div>}
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const Chip=({on,children,...p})=><button {...p} className={"px-3 py-1.5 rounded-md border text-sm "+(on?"bg-cyan-500/20 border-cyan-400 text-cyan-200":"border-slate-700 text-slate-400 hover:border-slate-500")}>{children}</button>;

function Setup({start}){
 const[n,setN]=useState(10),[tm,setTm]=useState(30),[study,setStudy]=useState(false),[inst,setInst]=useState(false),[dm,setDm]=useState([0,1,2,3,4,5]),[ty,setTy]=useState(["mc","dnd","lab"]);
 const tg=(a,set,v)=>set(a.includes(v)?a.filter(x=>x!==v):[...a,v]);
 return <div className="max-w-3xl mx-auto p-5 space-y-6">
  <div><div className="text-cyan-400 mono text-sm">$ ccna --200-301</div><h1 className="text-3xl font-bold text-white">CCNA Prep Lab</h1><p className="text-slate-400 text-sm">Configure your session, then start. Includes a live IOS CLI simulator.</p></div>
  <section><h2 className="font-semibold mb-2">Questions: <span className="text-cyan-300">{n}</span></h2><div className="flex gap-2 flex-wrap items-center">{[1,10,25,50,100].map(v=><Chip key={v} on={n==v} onClick={()=>setN(v)}>{v}</Chip>)}<input type="range" min="1" max="100" value={n} onChange={e=>setN(+e.target.value)} className="accent-cyan-400"/></div></section>
  <section><h2 className="font-semibold mb-2">Timer</h2><div className="flex gap-2 flex-wrap">{[15,30,60,120].map(v=><Chip key={v} on={!study&&tm==v} onClick={()=>{setStudy(false);setTm(v)}}>{v} min</Chip>)}<Chip on={study} onClick={()=>setStudy(!study)}>Untimed / Study Mode</Chip><Chip on={inst} onClick={()=>setInst(!inst)}>Check each question instantly</Chip></div></section>
  <section><h2 className="font-semibold mb-2">Domains</h2><div className="grid sm:grid-cols-2 gap-2">{DOM.map((d,i)=><label key={i} className="flex gap-2 items-center text-sm"><input type="checkbox" checked={dm.includes(i)} onChange={()=>tg(dm,setDm,i)} className="accent-cyan-400"/>{i+1}. {d}</label>)}</div></section>
  <section><h2 className="font-semibold mb-2">Question types</h2><div className="flex gap-2">{[["mc","Multiple Choice"],["dnd","Drag-and-Drop"],["lab","Interactive CLI Labs"]].map(([k,l])=><Chip key={k} on={ty.includes(k)} onClick={()=>tg(ty,setTy,k)}>{l}</Chip>)}</div></section>
  <button onClick={()=>start({n,tm,study,inst,dm,ty})} className="w-full py-3 rounded-lg bg-cyan-500 text-slate-950 font-bold hover:bg-cyan-400">Start session →</button></div>}

const isOk=(it,ans,labs)=>it.type=="dnd"?it.map.every((z,j)=>(ans[it.id]||{})[j]===z):it.type=="lab"?!!labs[it.id]&&gradeLab(it,labs[it.id].s).every(x=>x.ok):(ans[it.id]||[]).slice().sort().join()==it.a.join();

function Exam({items,cfg,onEnd}){
 const[i,setI]=useState(0),[ans,setAns]=useState({}),[fl,setFl]=useState({}),[labs,setLabs]=useState({}),[rev,setRev]=useState({}),[tt,setTt]=useState({}),[left,setLeft]=useState(cfg.tm*60);
 const it=items[i];const ref=useRef();ref.current={i,ans,labs,tt};
 const finish=()=>onEnd({items,ans,labs,tt:ref.current.tt});
 useEffect(()=>{const h=setInterval(()=>{setTt(t=>({...t,[ref.current.i]:(t[ref.current.i]||0)+1}));if(!cfg.study)setLeft(l=>l-1)},1000);return()=>clearInterval(h)},[]);
 useEffect(()=>{if(!cfg.study&&left<=0)finish()},[left]);
 const getLs=it=>labs[it.id]||{s:mkState(it.host),out:["Press ENTER to begin. Type 'enable' for privileged mode."]};
 const sel=j=>{const cur=ans[it.id]||[];setAns({...ans,[it.id]:it.type=="multi"?(cur.includes(j)?cur.filter(x=>x!=j):[...cur,j]):[j]})};
 const answered=x=>x.type=="dnd"?Object.keys(ans[x.id]||{}).length>0:x.type=="lab"?!!labs[x.id]&&labs[x.id].s.cfg.length>0:(ans[x.id]||[]).length>0;
 const show=(cfg.study||cfg.instant)&&rev[it.id];
 return <div className="max-w-6xl mx-auto p-3 space-y-3">
  <div className="sticky top-0 z-10 bg-slate-950/95 backdrop-blur border-b border-slate-800 pb-2 space-y-2">
   <div className="flex items-center gap-3 flex-wrap"><span className="mono text-lg text-cyan-300">⏱ {cfg.study?"Study mode":fmt(Math.max(left,0))}</span>
    <div className="flex-1 min-w-[120px] h-2 bg-slate-800 rounded"><div className="h-2 bg-cyan-500 rounded" style={{width:items.filter(answered).length/items.length*100+"%"}}/></div>
    <span className="text-xs text-slate-400">{items.filter(answered).length}/{items.length} answered</span>
    <button onClick={()=>confirm("End exam and see results?")&&finish()} className="px-3 py-1 rounded bg-rose-600 text-white text-sm">End Exam</button></div>
   <div className="flex gap-1 flex-wrap">{items.map((x,j)=><button key={x.id} onClick={()=>setI(j)} className={"w-7 h-7 rounded text-xs "+(fl[x.id]?"bg-amber-500 text-black":answered(x)?"bg-emerald-600 text-white":"bg-slate-800 text-slate-400")+(j==i?" ring-2 ring-cyan-300":"")}>{j+1}</button>)}</div></div>
  <div className="text-xs text-slate-500">Q{i+1} · {DOM[it.d]} · {it.t}</div>
  {it.type=="lab"?<div className="grid lg:grid-cols-2 gap-3">
   <div className="space-y-3"><h2 className="font-semibold text-white">{it.title}</h2><pre className="mono text-xs bg-slate-900 border border-slate-800 rounded-lg p-3 overflow-x-auto text-cyan-200">{it.topo}</pre>
    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3"><div className="text-sm font-semibold mb-1">Task checklist</div>{gradeLab(it,getLs(it).s).map((t,k)=><div key={k} className={"text-sm "+(show||cfg.study?(t.ok?"text-emerald-400":"text-slate-400"):"text-slate-300")}>{cfg.study&&t.ok?"☑":"☐"} {t.tx}</div>)}</div></div>
   <Terminal key={it.id} it={it} ls={getLs(it)} setLs={v=>setLabs({...labs,[it.id]:v})}/></div>
  :it.type=="dnd"?<Dnd key={it.id} it={it} val={ans[it.id]||{}} set={v=>setAns({...ans,[it.id]:v})} show={show}/>:<div className="bg-slate-900 border border-slate-800 rounded-lg p-4 space-y-3"><p className="text-white">{it.q}{it.type=="multi"&&<span className="text-amber-300 text-sm"> (Choose two)</span>}</p>
   {it.pre&&<pre className="mono text-xs bg-black rounded p-3 overflow-x-auto text-emerald-300">{it.pre}</pre>}
   {it.o.map((o,j)=>{const on=(ans[it.id]||[]).includes(j);const c=show?(it.a.includes(j)?"border-emerald-500 bg-emerald-500/10":on?"border-rose-500 bg-rose-500/10":"border-slate-700"):on?"border-cyan-400 bg-cyan-500/10":"border-slate-700 hover:border-slate-500";return <button key={j} onClick={()=>sel(j)} className={"block w-full text-left px-3 py-2 rounded border text-sm "+c}>{String.fromCharCode(65+j)}. {o}</button>})}</div>}
  {show&&<div className="bg-slate-900 border border-cyan-800 rounded-lg p-3 text-sm"><b className={isOk(it,ans,labs)?"text-emerald-400":"text-rose-400"}>{isOk(it,ans,labs)?"Correct":"Incorrect"}</b> — {it.e}</div>}
  <div className="flex gap-2 flex-wrap"><button disabled={i==0} onClick={()=>setI(i-1)} className="px-4 py-2 rounded bg-slate-800 disabled:opacity-30">← Prev</button>
   <button onClick={()=>setFl({...fl,[it.id]:!fl[it.id]})} className="px-4 py-2 rounded bg-slate-800 text-amber-300">⚑ {fl[it.id]?"Unflag":"Flag"}</button>
   {(cfg.study||cfg.instant)&&<button onClick={()=>setRev({...rev,[it.id]:true})} className="px-4 py-2 rounded bg-cyan-700 text-white">Check Answer & Show Explanation</button>}
   <button disabled={i==items.length-1} onClick={()=>setI(i+1)} className="px-4 py-2 rounded bg-slate-800 disabled:opacity-30 ml-auto">Next →</button></div></div>}

function Results({r,again,weakQuiz}){
 const{items,ans,labs,tt}=r;const ok=items.map(x=>isOk(x,ans,labs));const pct=ok.filter(Boolean).length/items.length;const score=Math.round(100+pct*900);
 const dA={},tA={};items.forEach((x,k)=>{[[dA,x.d],[tA,x.t]].forEach(([m,key])=>{m[key]=m[key]||{c:0,n:0};m[key].n++;if(ok[k])m[key].c++})});
 const weak=Object.entries(tA).filter(([,v])=>v.c/v.n<.75);
 return <div className="max-w-4xl mx-auto p-4 space-y-6">
  <div className={"rounded-xl p-5 border "+(score>=825?"border-emerald-500 bg-emerald-500/10":"border-rose-500 bg-rose-500/10")}><div className="text-sm text-slate-400">Score (pass = 825/1000)</div><div className="text-5xl font-bold text-white">{score}<span className="text-xl text-slate-400">/1000</span></div><div className={"font-bold "+(score>=825?"text-emerald-400":"text-rose-400")}>{score>=825?"PASS":"FAIL"}</div><div className="text-sm text-slate-400">{ok.filter(Boolean).length}/{items.length} correct · {fmt(Object.values(tt).reduce((a,b)=>a+b,0))} total · avg {Math.round(Object.values(tt).reduce((a,b)=>a+b,0)/items.length)}s per question</div></div>
  <section><h2 className="font-semibold mb-2 text-white">Domain breakdown</h2>{Object.entries(dA).map(([d,v])=>{const p=Math.round(v.c/v.n*100);return <div key={d} className="mb-2"><div className="flex justify-between text-sm"><span>{DOM[d]}</span><span>{p}% ({v.c}/{v.n})</span></div><div className="h-2.5 bg-slate-800 rounded"><div className={"h-2.5 rounded "+(p>=75?"bg-emerald-500":"bg-rose-500")} style={{width:p+"%"}}/></div></div>})}</section>
  <section><h2 className="font-semibold mb-2 text-white">What you need to learn more</h2>{weak.length==0?<p className="text-emerald-400 text-sm">No topic below 75%. Nice work.</p>:<>{weak.map(([t,v])=>{const tp=TIPS[t]||["Review this topic.","—"];return <div key={t} className="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-2"><div className="font-semibold text-rose-300">{t} <span className="text-slate-500 text-sm">{Math.round(v.c/v.n*100)}%</span></div><p className="text-sm my-1">{tp[0]}</p><pre className="mono text-xs bg-black rounded p-2 text-emerald-300 whitespace-pre-wrap">{tp[1]}</pre></div>})}
   <button onClick={()=>weakQuiz(weak.map(w=>w[0]))} className="px-4 py-2 rounded bg-cyan-500 text-slate-950 font-bold">Generate a Custom Practice Quiz on Weak Areas Only</button></>}</section>
  <section><h2 className="font-semibold mb-2 text-white">Question review</h2>{items.map((x,k)=><div key={x.id} className="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-2 text-sm space-y-1">
   <div className="flex justify-between"><b>Q{k+1}. {x.type=="lab"?x.title:x.q}</b><span className={ok[k]?"text-emerald-400":"text-rose-400"}>{ok[k]?"✓":"✗"} {tt[k]||0}s</span></div>
   {x.pre&&<pre className="mono text-xs text-emerald-300 overflow-x-auto">{x.pre}</pre>}
   {x.type=="lab"?<div>{gradeLab(x,(labs[x.id]||{s:mkState(x.host)}).s).map((t,j)=><div key={j} className={"mono text-xs "+(t.ok?"text-emerald-400":"text-rose-400")}>{t.ok?"  + ":"  - "}{t.need}{t.ok?"":"   ← missing from your running-config"}</div>)}</div>
   :x.type=="dnd"?<div>{x.items.map((m,j)=>{const z=(ans[x.id]||{})[j];return <div key={j} className={z===x.map[j]?"text-emerald-400":"text-rose-400"}>{m} → {z==null?"(unplaced)":x.zones[z]}{z===x.map[j]?"":" (correct: "+x.zones[x.map[j]]+")"}</div>})}</div>:<><div>Your answer: <span className={ok[k]?"text-emerald-400":"text-rose-400"}>{(ans[x.id]||[]).map(j=>x.o[j]).join("; ")||"(none)"}</span></div><div>Correct: <span className="text-emerald-400">{x.a.map(j=>x.o[j]).join("; ")}</span></div></>}
   <div className="text-slate-400">{x.e}</div></div>)}</section>
  <button onClick={again} className="px-4 py-2 rounded bg-slate-800">New session</button></div>}

function App(){
 const[scr,setScr]=useState("setup"),[cfg,setCfg]=useState(null),[items,setItems]=useState([]),[res,setRes]=useState(null);
 const start=c=>{const p=Q.filter(x=>c.dm.includes(x.d)&&c.ty.includes(x.type=="lab"?"lab":x.type=="dnd"?"dnd":"mc"));if(!p.length)return alert("No questions match your filters.");setCfg(c);setItems(shuffle(p).slice(0,c.n));setScr("exam")};
 const weakQuiz=ts=>{const p=Q.filter(x=>ts.includes(x.t));setCfg({...cfg,study:true,tm:0});setItems(shuffle(p));setScr("exam");setRes(null)};
 return scr=="setup"?<Setup start={start}/>:scr=="exam"?<Exam key={items.map(x=>x.id).join()} items={items} cfg={cfg} onEnd={r=>{setRes(r);setScr("res")}}/>:<Results r={res} again={()=>setScr("setup")} weakQuiz={weakQuiz}/>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
